# Changes to this file take effect on the next keyboard event.
# MOD is the left or right Meta/Super key.
# Supported modifiers: MOD, SHIFT, CTRL, RIGHTCTRL, ALT.
# Supported named keys: DELETE (or DEL), ENTER, ESC, SPACE, TAB, BACKSPACE, MICMUTE,
# function keys F1-F24, letters A-Z, and digits 0-9.
trigger = RIGHTCTRL
exit = MOD + DELETE
