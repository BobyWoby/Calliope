# Changes to this file take effect on the next keyboard event.
# MOD is the left or right Meta/Super key.
# Supported modifiers: MOD, SHIFT, CTRL, ALT.
# Supported named keys: DELETE (or DEL), ENTER, ESC, SPACE, TAB, BACKSPACE,
# letters A-Z, and digits 0-9.
trigger = MOD + SHIFT + V
exit = MOD + DELETE
